name: x86-fexcore

on:
  workflow_dispatch:
    inputs:
      host:
        type: boolean
        default: false
        description: "Self-hosted"
      version:
        type: string
        description: "(e.g. 'FEX-2607, 2607'). Empty = presets (2607) + latest stable. DLL-only (2 PE DLLs)"

  schedule:
    - cron: "0 17 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN:        ${{ github.token }}
  UNI_KIND:        fexcore
  REL_TAG_STABLE:  FEXCore
  UPSTREAM_REPO:   FEX-Emu/FEX

defaults:
  run:
    shell: 'bash --noprofile --norc -Eeuo pipefail {0}'

jobs:
  guard:
    name: Build Guard
    runs-on: ${{ inputs.host == true && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      IN_VERSION:  ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      list:    ${{ steps.check.outputs.list }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Upstream & Queue
        id: check
        run: |
          if [[ -n "${IN_VERSION:-}" ]]; then
            IN_VERSION="${IN_VERSION// /,}"
            export IN_VERSION
          fi

          bash ./scripts/guard.sh

  build:
    name: Build & Pack
    needs: guard
    if: needs.guard.outputs.missing == 'true'
    runs-on: ${{ inputs.host == true && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deps
        run: bash ./scripts/install-deps-ubuntu.sh

      - name: Setup Build Env (RootCellar llvm-mingw)
        run: bash ./scripts/setup-llvm-meson.sh

      - name: Build queued artifacts
        env:
          TO_BUILD: ${{ needs.guard.outputs.list }}
        run: bash ./scripts/build-queue.sh

      - name: Release
        env:
          REPO:           ${{ github.repository }}
          REL_TAG:        ${{ env.REL_TAG_STABLE }}
          ARTIFACT_GLOB:  "out/FEXCore-*.wcp"
          VERSION_PREFIX: "FEXCore-"
          BODY_KEYS: "common"
        run: bash ./scripts/release.sh

  maintenance:
    name: Refresh pack.json + README
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/chore_purrrser.yml
    secrets: inherit
    permissions:
      contents: write
