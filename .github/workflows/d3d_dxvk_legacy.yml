# Pre-1.9 DXVK: no clang release compiles these, so they build with mingw-gcc.
# Frozen upstream, so there is nothing for a schedule to find: dispatch only.
name: d3d-dxvk-legacy

on:
  workflow_dispatch:
    inputs:
      host:
        type: boolean
        default: false
        description: "Self-hosted"
      version:
        type: string
        description: "(e.g. 1.5.5, 1.7.2, 1.7.3). Empty = all three legacy presets"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN:       ${{ github.token }}
  UNI_KIND:       dxvk-legacy
  REL_TAG_STABLE: DXVK
  UPSTREAM_REPO:  doitsujin/dxvk

defaults:
  run:
    shell: 'bash --noprofile --norc -Eeuo pipefail {0}'

jobs:
  guard:
    name: Build Guard
    runs-on: ${{ inputs.host == true && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      IN_VERSION:  ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    outputs:
      missing:     ${{ steps.check.outputs.missing }}
      list:        ${{ steps.check.outputs.list }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Upstream & Queue
        id: check
        run: bash ./scripts/guard.sh

  build:
    name: Build & Pack
    needs: guard
    if: needs.guard.outputs.missing == 'true'
    runs-on: ${{ inputs.host == true && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deps
        run: bash ./scripts/install-deps-ubuntu.sh

      - name: Setup Build Env (Meson + mingw-gcc)
        run: bash ./scripts/setup-llvm-meson.sh

      - name: Build queued artifacts
        env:
          TO_BUILD: ${{ needs.guard.outputs.list }}
        run: bash ./scripts/build-queue.sh
      - name: Release
        env:
          REPO:           ${{ github.repository }}
          REL_TAG:        ${{ env.REL_TAG_STABLE }} 
          VERSION_PREFIX: "dxvk-"
          ARTIFACT_GLOB:  "out/dxvk-*.wcp"
          BODY_KEYS: "general dxvk prereg proton"
        run: bash ./scripts/release.sh

  maintenance:
    name: Refresh pack.json + README
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/chore_purrrser.yml
    secrets: inherit
    permissions:
      contents: write
